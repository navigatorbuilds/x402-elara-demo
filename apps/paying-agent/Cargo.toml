[package]
name = "paying-agent"
version = "0.1.0"
edition = "2021"
publish = false
# MIT OR Apache-2.0. Links ONLY permissive crates. It delegates the one signing
# step to the AGPL `elara-mint` binary via subprocess, so it carries no AGPL
# obligation.
license = "MIT OR Apache-2.0"
description = "An autonomous paying agent: pays an x402 resource, then mints an offline-verifiable Elara work-receipt for the act."

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
anyhow = "1"

# The permissive receipt half — assemble the offline envelope + verify it.
x402-work-receipt = { path = "../../crates/x402-work-receipt" }

# ── LIVE x402 client path — opt-in (feature `live-x402`) ─────────────────────
# SIM is the zero-dependency default so `cargo run -p paying-agent` is fast and
# needs no wallet. `--features live-x402` compiles the real Base Sepolia client
# (the full alloy stack). One upstream quirk we work around: x402-chain-eip155
# 2.0.2's `client` code calls `tracing::` but only its `telemetry` feature links
# the `tracing` crate — so we enable BOTH `client` and `telemetry` (without
# telemetry the crate fails to compile with E0433, unresolved `tracing`).
# Verified to compile 2026-07-14 (alloy-contract 2.1.1 is published; an earlier
# note here claiming it was unpublished was a stale local registry index).
reqwest = { version = "0.13", features = ["json"], optional = true }
reqwest-middleware = { version = "0.5", features = ["json"], optional = true }
x402-reqwest = { version = "2.0.2", features = ["json"], optional = true }
x402-chain-eip155 = { version = "2.0.2", features = ["client", "telemetry"], optional = true }
x402-types = { version = "2.0.2", optional = true }
alloy-signer-local = { version = "2.0", optional = true }

[features]
default = []
live-x402 = [
    "dep:reqwest",
    "dep:reqwest-middleware",
    "dep:x402-reqwest",
    "dep:x402-chain-eip155",
    "dep:x402-types",
    "dep:alloy-signer-local",
]
